<body>

</div></header>
<section class="page-hero"><div class="container"><a class="back-link" href="aktiviti.html">← Kembali ke Aktiviti</a><div id="detail-kicker" class="kicker">Dokumentasi</div><h1 id="detail-title">Memuatkan…</h1><p id="detail-meta"></p></div></section>
<section class="section"><div class="container">
<p id="detail-description" class="lead"></p><div id="detail-gallery" class="gallery gallery-large"></div><div id="detail-status" class="callout">Memuatkan gambar…</div>
</div></section>
<footer class="footer"><div class="container bottom">© 2026 Ikatan Inspirasi Muslim Nasional (i-MAN) · PPM-008-03-14102014 · iraudhah.com</div></footer>
<script src="js/app.js"></script><script src="js/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
 const url=window.IMAN_SUPABASE_URL,key=window.IMAN_SUPABASE_KEY, q=new URLSearchParams(location.search), id=q.get('id');
 const title=document.getElementById('detail-title'), meta=document.getElementById('detail-meta'), desc=document.getElementById('detail-description'), gal=document.getElementById('detail-gallery'), status=document.getElementById('detail-status');
 if(!id || !url || url.startsWith('PASTE_') || !key || key.startsWith('PASTE_')){title.textContent='Dokumentasi tidak tersedia';status.textContent='Sambungan galeri belum disediakan.';return;}
 const sb=window.supabase.createClient(url,key); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
 const fmt=v=>v?new Intl.DateTimeFormat('ms-MY',{day:'numeric',month:'long',year:'numeric'}).format(new Date(v+'T00:00:00')):'';
 (async()=>{
  const er=await sb.from('events').select('id,title,event_date,location,category,description').eq('id',id).maybeSingle();
  if(er.error||!er.data){title.textContent='Aktiviti tidak ditemui';status.textContent='Rekod aktiviti tidak ditemui.';return;}
  const e=er.data; title.textContent=e.title; document.title=e.title+' | i-MAN'; document.getElementById('detail-kicker').textContent=e.category||'Aktiviti';
  meta.textContent=fmt(e.event_date)+(e.location?' · '+e.location:''); desc.textContent=e.description||'';
  const ph=await sb.from('event_photos').select('file_path,caption,sort_order').eq('event_id',id).order('sort_order',{ascending:true});
  if(ph.error){status.textContent='Gambar tidak dapat dimuatkan.';return;}
  if(!ph.data.length){status.textContent='Belum ada gambar untuk aktiviti ini.';return;}
  status.hidden=true;
  gal.innerHTML=ph.data.map(p=>{const u=sb.storage.from('activity-photos').getPublicUrl(p.file_path).data.publicUrl;return `<figure><img src="${esc(u)}" alt="${esc(p.caption||e.title)}" loading="lazy">${p.caption?'<figcaption>'+esc(p.caption)+'</figcaption>':''}</figure>`}).join('');
 })();
})();
</script></body></html>
